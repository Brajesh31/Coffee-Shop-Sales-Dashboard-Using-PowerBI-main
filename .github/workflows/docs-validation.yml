name: 📚 Documentation validation

on:
  push:
    branches: [main, "docs/**"]
    paths:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/docs-validation.yml"
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/docs-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation and repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate documentation links and required files
        run: python scripts/validate_docs.py
