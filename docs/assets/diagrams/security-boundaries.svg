<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="t d">
<title id="t">Security boundaries for the Power BI repository</title><desc id="d">Repository artifacts, maintainer workstation, and optional Power BI Service are separated by review and access-control boundaries.</desc>
<rect width="1100" height="420" rx="22" fill="#F8FAFC"/><g font-family="Arial,sans-serif">
<rect x="45" y="85" width="280" height="240" rx="18" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/><text x="185" y="125" font-size="22" text-anchor="middle" font-weight="700" fill="#4C1D95">GitHub repository</text><g fill="#4C1D95" font-size="17"><text x="78" y="175">• PBIX report</text><text x="78" y="210">• Excel workbook</text><text x="78" y="245">• Docs and SVG assets</text><text x="78" y="280">• Actions and templates</text></g>
<rect x="410" y="85" width="280" height="240" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="550" y="125" font-size="22" text-anchor="middle" font-weight="700" fill="#166534">Maintainer device</text><g fill="#166534" font-size="17"><text x="447" y="175">• Power BI Desktop</text><text x="447" y="210">• Local working copies</text><text x="447" y="245">• Approved credentials</text><text x="447" y="280">• QA and review</text></g>
<rect x="775" y="85" width="280" height="240" rx="18" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/><text x="915" y="125" font-size="22" text-anchor="middle" font-weight="700" fill="#92400E">Optional Service</text><g fill="#92400E" font-size="17"><text x="813" y="175">• Workspace permissions</text><text x="813" y="210">• Credentials / gateway</text><text x="813" y="245">• Report sharing</text><text x="813" y="280">• Refresh ownership</text></g>
<g stroke="#334155" stroke-width="4" fill="none"><path d="M325 205h85"/><path d="M690 205h85"/></g><g font-size="14" text-anchor="middle" fill="#334155"><text x="367" y="185">review</text><text x="732" y="185">publish if approved</text></g>
<text x="550" y="370" text-anchor="middle" fill="#475569" font-size="17">Service environment is optional and not confirmed as configured in this repository</text></g></svg>