<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Coffee shop sales analysis workflow</title><desc id="desc">Open report, set filter context, review KPIs, compare segments, explore products, and validate findings.</desc><rect width="1100" height="560" rx="26" fill="#fbf7f0"/><text x="550" y="52" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#422719">📊 Analyst exploration workflow</text><g font-family="Arial" text-anchor="middle" font-size="17" fill="#422719" stroke="#b98152" stroke-width="2"><rect x="70" y="105" width="255" height="74" rx="14" fill="#fff"/><text x="197" y="150" stroke="none">1. Open report</text><rect x="425" y="105" width="255" height="74" rx="14" fill="#fff"/><text x="552" y="150" stroke="none">2. Set filter context</text><rect x="780" y="105" width="255" height="74" rx="14" fill="#fff"/><text x="907" y="150" stroke="none">3. Review KPIs</text><rect x="780" y="300" width="255" height="74" rx="14" fill="#fff"/><text x="907" y="345" stroke="none">4. Compare month/store/category</text><rect x="425" y="300" width="255" height="74" rx="14" fill="#fff"/><text x="552" y="345" stroke="none">5. Explore products and time</text><rect x="70" y="300" width="255" height="74" rx="14" fill="#f1e2d3"/><text x="197" y="345" stroke="none">6. Validate finding</text></g><g fill="none" stroke="#8a6b57" stroke-width="4"><path d="M325 142 H415"/><path d="M680 142 H770"/><path d="M907 179 V290"/><path d="M780 337 H690"/><path d="M425 337 H335"/></g><g fill="#8a6b57"><path d="M410 134 l12 8 -12 8z"/><path d="M765 134 l12 8 -12 8z"/><path d="M899 284 l8 12 8 -12z"/><path d="M696 329 l-12 8 12 8z"/><path d="M341 329 l-12 8 12 8z"/></g><text x="550" y="470" text-anchor="middle" font-family="Arial" font-size="16" fill="#806653">Treat findings as hypotheses and validate using source data and context.</text></svg>