<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Power BI data refresh flow</title><desc id="desc">Power Query reads the Excel workbook, loads the model, and report visuals update after a user refresh.</desc><rect width="1100" height="360" rx="24" fill="#fbf7f0"/><text x="550" y="48" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#422719">🔄 Data refresh sequence</text><g font-family="Arial" text-anchor="middle"><rect x="35" y="120" width="170" height="110" rx="14" fill="#fff" stroke="#b98152" stroke-width="2"/><text x="120" y="165" font-size="19" fill="#422719">👤 User</text><text x="120" y="195" font-size="14" fill="#6c5546">Refresh</text><rect x="260" y="120" width="190" height="110" rx="14" fill="#fff" stroke="#b98152" stroke-width="2"/><text x="355" y="165" font-size="19" fill="#422719">⚙️ Power Query</text><text x="355" y="195" font-size="14" fill="#6c5546">Run queries</text><rect x="505" y="120" width="170" height="110" rx="14" fill="#fff" stroke="#b98152" stroke-width="2"/><text x="590" y="165" font-size="19" fill="#422719">📄 Excel</text><text x="590" y="195" font-size="14" fill="#6c5546">Read source</text><rect x="730" y="120" width="160" height="110" rx="14" fill="#fff" stroke="#b98152" stroke-width="2"/><text x="810" y="165" font-size="19" fill="#422719">🧱 Model</text><text x="810" y="195" font-size="14" fill="#6c5546">Load data</text><rect x="945" y="120" width="130" height="110" rx="14" fill="#6f3e24"/><text x="1010" y="165" font-size="19" fill="#fff">📊 Visuals</text><text x="1010" y="195" font-size="14" fill="#fff">Render</text></g><g stroke="#8a6b57" stroke-width="3" fill="none"><path d="M205 175 H250"/><path d="M450 175 H495"/><path d="M675 175 H720"/><path d="M890 175 H935"/></g><g fill="#8a6b57"><path d="M244 168 l10 7 -10 7z"/><path d="M489 168 l10 7 -10 7z"/><path d="M714 168 l10 7 -10 7z"/><path d="M929 168 l10 7 -10 7z"/></g><text x="550" y="294" text-anchor="middle" font-family="Arial" font-size="15" fill="#806653">Conceptual flow. Exact query sequence must be verified in the PBIX.</text></svg>