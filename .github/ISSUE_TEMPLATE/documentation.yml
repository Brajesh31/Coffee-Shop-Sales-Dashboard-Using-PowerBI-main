name: "📚 Documentation improvement"
description: Report missing, unclear, or inaccurate project documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Document or section
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is missing or inaccurate?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction or evidence
